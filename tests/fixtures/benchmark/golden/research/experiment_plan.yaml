research_problem:
  question: 冰面域随机化对推箱策略鲁棒性的影响（研究设计，不执行训练）
  motivation: 历史 Q1 冰面实验给出负结论，本计划只回答「随机化设计是否可检验」，不改写历史结论
  prior_evidence: Phase 1 Q1（ice/normal=0.824<2.0，contradiction_control_not_robust）作为先验证据引用，不作翻案
  rl_constraints_unchanged: true
parameter_definitions:
- name: friction
  unit: '1'
  range:
  - 0.05
  - 0.95
  rationale: 冰面与地面摩擦系数按干/湿木材与冰面的实测区间取 [0.05, 0.95]，覆盖策略可能遇到的滑/涩两端
- name: contact_stiffness
  unit: N/m
  range:
  - 500
  - 5000
  rationale: 低温下接触刚度随材料硬化上升，取 [500, 5000] N/m 覆盖软接触到接近刚体两种极端
- name: joint_damping
  unit: N*m*s/rad
  range:
  - 0.1
  - 2.0
  rationale: 关节阻尼受润滑与温度影响，[0.1, 2.0] N*m*s/rad 为常见机器人关节参数带
probability_distributions:
  friction:
    family: uniform
    low: 0.05
    high: 0.95
    support:
    - 0.05
    - 0.95
    rationale: 摩擦系数无先验方向，均匀分布是最大熵选择，区间与 parameter_definitions 一致
  contact_stiffness:
    family: log-uniform
    low: 500
    high: 5000
    support:
    - 500
    - 5000
    rationale: 刚度跨一个数量级，对数均匀避免把采样质量集中在上界
  joint_damping:
    family: uniform
    low: 0.1
    high: 2.0
    support:
    - 0.1
    - 2.0
    rationale: 阻尼在区间内近似线性可调，均匀分布与硬件标定精度相匹配
parameter_correlations:
- pair:
  - friction
  - contact_stiffness
  rationale: 冰面湿滑与接触刚度同源物理耦合（合成夹具理由）
randomization_method: 每次 episode 开始时按参数类别独立采样
sampling_strategy: 拉丁超立方 + 分层覆盖
curriculum: 第 1 阶段低摩擦权重 0.5，第 2 阶段线性升至 0.9
dataset_splits:
  disjoint: true
  train:
    ids:
    - e1
    - e2
    - e3
    episodes: 3
  validation:
    ids:
    - v1
    - v2
    episodes: 2
  holdout:
    ids:
    - h1
    - h2
    episodes: 2
random_seeds:
- 0
- 1
- 2
metrics:
- name: success_rate
  maps_to: metrics
- name: ice_ratio
  maps_to: parameter_definitions
ablation_study:
- name: no_dr
  removes: randomization_method
- name: no_iciness
  removes: probability_distributions
- name: no_curriculum
  removes: curriculum
failure_taxonomy:
  slip_off: 冰面滑出目标区
  stuck: 接触力不足无法推动
sim_to_real_risks:
- 真实冰面摩擦系数分布未知，仿真区间可能过窄
- 接触刚度在低温下非线性，线性近似项不可消除
conclusion_criteria:
  rule: 若 holdout 成功率相对基线的提升 <5% 则判不成立
  evidence_refs:
  - metrics
  - dataset_splits
  - ablation_study
_provenance:
  synthetic_fixture: true
  case_id: golden_r1
  note: 研究设计（合成）
