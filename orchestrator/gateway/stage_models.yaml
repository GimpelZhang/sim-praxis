# SimPraxis 三阶段模型配置（v4，用户直接指令）。本文件是仓库内【唯一】允许写模型 ID
# 的地方：火山供应随时可能变，但【v4.2 决策 3】执行期任何 model_id 变更（含同家族日期
# 版本兜底、含置 null）都必须先 STOP→inventory 清点→请示用户，获批后才允许改本文件，
# 改后必须跑
#   /mnt/venvs/simpraxis/bin/python -m orchestrator.gateway.router --validate-models
# 三个 stage 全部 200 且 type=message 才算换供成功。禁止执行者自行换 ID/换供应商/猜 ID，
# 禁止把模型 ID 写进任何代码；获批后的换供重验批次在计划 8 次预算之外，另计、逐次记录。
# model_id 不是密钥，本文件直接提交；鉴权值只从 ~/.bashrc 的 ANTHROPIC_* 族经环境注入。
# null 合规路径（对任何 stage 保留）：供应侧确无可用模型时，经用户批准允许 model_id: null，
#   但必须同时给 open_question，且其文本逐字出现在 .omc/plans/open-questions.md 中；
#   null stage 跳过付费校验并报告 SKIP-DUE-TO-NULL（显式缺口，不是假通过），调用期
#   抛 StageUnresolvedError，不触网。
meta:
  schema_version: "1.0"
  endpoint: anthropic-messages
  base_url_env: ANTHROPIC_BASE_URL
stage_models:
  # 2026-11-02 硬规则 1 换供（用户会话内逐字直接裁决）+ 换供应商：
  # 端点 env 实读为 Tencent tokenhub（https://tokenhub.tencentmaas.com/plan/anthropic，
  # 原火山方舟 /api/coding 不再使用，供应商切换系用户显式决定，非执行者行为）。
  # 用户逐字指定：macro_ideation=glm-5.3，coding_debug=deepseek-v4.1-flash-1017，
  # visual_rollout=deepseek-v4.1-flash-1017。
  # 清点取证：新供应商无模型清单端点——GET /models、/v1/models 均 HTTP 404
  # （本文件头所载 inventory_models.py 的 /v1/models 路径随之 404，无 200 清单可落）；
  # 按硬规则 1 不猜 ID，逐字采用用户给定 ID，以 --validate-models 实呼为最终闸。
  # 前供沿革（2026-10-27，火山方舟）：macro=glm-5.3、coding=kimi-k3.1-pro、
  # visual=deepseek-v4.1-flash；清点 runs/inventory/20261027-175140（GET /v1/models
  # 200，138 条）；换供重验批次 M2-V-mixed1 两轮共 9 账外实呼、ledger seq 恒 308。
  # 换供后 --validate-models 重验（批次件 M2-V-mixed1，G-13 账外路径不占 seq）：
  # 首轮 17:54 --max-tokens 8，macro glm-5.3 连续 5 次 HTTP200 空回答（思考前缀型，
  # 同 M2-V-mimo1 先例），FAILURE 落 runs/model_validate/20261027-175406；
  # 次轮 18:00:53 --max-tokens 64 四 ping 全绿（3 文本 pong + 视觉 Red 断言通过），
  # 证据 runs/model_validate/20261027-180053/result.json（latest 指此），两轮共 9 个
  # 账外实呼（5+4），ledger seq 恒 308 未增。
  # 前值（2026-10-24…27）：mimo 家族 macro=mimo-v2.6-pro、coding/visual=mimo-v2.6-flash。
  macro_ideation:
    model_id: glm-5.3               # 2026-11-02 用户逐字裁决（换供应商 tokenhub）
    capabilities: [text]
    purpose: "方向探索与可行性调研（Macro Ideation）"
  coding_debug:
    # 历史沿革：glm-5.3-flash（思考不可关阴性）→ 2026-10-20 用户两次裁决
    # deepseek-v4.1-flash → 2026-10-24 用户裁决 mimo-v2.6-flash → 2026-10-27 用户
    # 逐字裁决 kimi-k3.1-pro → 2026-11-02 用户逐字裁决 deepseek-v4.1-flash-1017
    # （随供应商切换 tokenhub；见文件头注释）。
    # 旧证据 runs/task6_ascent/coding_model_evidence_matrix.json seq42-47 保留可溯。
    model_id: deepseek-v4.1-flash-1017
    capabilities: [text]
    purpose: "环境适配与代码编写（Coding & Debugging）"
  visual_rollout:
    model_id: deepseek-v4.1-flash-1017   # 2026-11-02 用户逐字裁决（换供应商 tokenhub）
    capabilities: [text, vision]
    purpose: "闭环仿真评估与视频审阅（Visual & Rollout Evaluation）"
