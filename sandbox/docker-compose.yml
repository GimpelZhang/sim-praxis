services:
  sim-sandbox:
    build:
      context: ./docker
      # 锁内适配（Task8，2026-10-15，规则8）：改用 Dockerfile.task8 离线 delta
      # overlay——FROM 钉死 Task7 终态镜像 tag task7-base（= sha256:50b6e10…），
      # genesis 闭包 wheel 经下方 additional_contexts bind-mount 离线装配
      # （--no-index），wheel 不进 git 上下文/不进镜像层。起因：劣化网络下 83.5MB
      # genesis wheel 在线构建 6 次 resume 仍 incomplete-download。从零在线构建的
      # 规范配方仍保留在 Dockerfile（网络恢复时可直接复现全量镜像）。
      dockerfile: Dockerfile.task8
      additional_contexts:
        wheels1: /mnt/caches/simpraxis/wheelhouse_task8
        wheels2: /mnt/caches/simpraxis/wheelhouse_task8_extras
      # 离线 overlay 不触网；host 保留仅作回退路径，不取包即无副作用。
      network: host
    image: sim-praxis/sandbox:phase1-task8
    container_name: sim_praxis_sandbox
    restart: "no"          # 不用 unless-stopped：GPU 必须能被显式释放
    init: true
    ipc: host              # 多进程仿真共享内存
    network_mode: host
    # Phase 2 Task0（P4）：非 root 运行（agent 1000:1000，Dockerfile 内建号但
    # 不切默认 USER——删本行即整体回退 Phase 1 root 行为）。宿主 bind 源全部
    # 1000:1000（00_env G-4 探针守门）；/dev/nvidia* 世界可读写，renderD 节点
    # 宿主 ACL 已授 uid 1000，故暂不需要 group_add（EGL smoke 实测，2026-10-17）。
    user: "${SIMPRAXIS_UID:-1000}:${SIMPRAXIS_GID:-1000}"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: "graphics,utility,compute,display"
      PYOPENGL_PLATFORM: egl
      DISPLAY: ":99"
      HF_HOME: /home/agent/.cache/huggingface
      MODELSCOPE_CACHE: /home/agent/.cache/modelscope
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # HF_TOKEN 仅运行期注入（m11）：不进 Dockerfile、不进镜像层、不进 build-arg
      HF_TOKEN: ${HF_TOKEN:-}
      SIMPRAXIS_RUN_DIR: /home/agent/runs
      # 锁内适配（Task7 图整体在容器内运行）：Gate2 视频阶梯据此跳过
      # `docker compose run` 嵌套，/mnt 同路径挂载下直接调镜像内 ffmpeg
      SIMPRAXIS_IN_SANDBOX: "1"
      # Phase 2 Task0：独立新账根（默认即 /mnt/artifacts/simpraxis/phase{1,2}，
      # 经下方 /mnt/artifacts 同路径挂载容器内也可见；显式透传防宿主自定义根时漂移）
      SIMPRAXIS_PHASE1_ROOT: ${SIMPRAXIS_PHASE1_ROOT:-}
      SIMPRAXIS_PHASE2_ROOT: ${SIMPRAXIS_PHASE2_ROOT:-}
      # 锁内适配（Task7 图整体容器内运行）：LLM 网关凭据与飞书长连接三变量、
      # LanceDB/fastembed 路径按「名」从宿主 shell（source scripts/00_env.sh）
      # 插值透传；值绝不写入本文件/镜像层/日志（硬规则4）。
      SIMPRAXIS_LLM_TOKEN: ${SIMPRAXIS_LLM_TOKEN:-}
      SIMPRAXIS_LLM_BASE_URL: ${SIMPRAXIS_LLM_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_RECEIVE_ID: ${FEISHU_RECEIVE_ID:-}
      # Task0b QA（L8）：数据层（LanceDB）不挂容器、不透传 SIMPRAXIS_LANCEDB_URI
      # ——sandbox/ 全树无数据层消费者，容器内内容层只有只读 /kb（见 volumes）。
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-}
      # Task0b：容器内方案内容层根（宿主 $KB_ROOT/solutions 只读挂到 /kb）
      SIMPRAXIS_SOLUTIONS_ROOT: ${SIMPRAXIS_SOLUTIONS_ROOT:-/kb}
      KB_ROOT: ${KB_ROOT:-/home/vipuser/embodied-ai-sim-knowledge-base}
      # 代理从宿主机 shell 显式继承（source scripts/00_env.sh 后再 compose）
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - ..:/workspace
      # Phase 2 Task0（P4）：非 root 缓存/权重/产物挂载点全部迁到 agent 家目录；
      # 宿主源保持 /mnt 字面路径不变（已全部 1000:1000，G-4 探针守门）。
      - /mnt/caches/hf:/home/agent/.cache/huggingface
      - /mnt/caches/modelscope:/home/agent/.cache/modelscope
      - /mnt/weights:/home/agent/weights
      - ${SIMPRAXIS_RUN_DIR:-/mnt/artifacts/simpraxis/runs}:/home/agent/runs
      # 锁内适配（计划 Task7 L545-548「容器调用方式锁内适配」）：图整体在容器内
      # 运行，ledger/批次凭据/检查点/lancedb/fastembed 缓存/venv/tours 必须与宿主
      # 同路径单份可见，否则 quota 账本与证据根会在容器内外分裂。以下挂载只暴露
      # simpraxis 自有 /mnt 字面路径（硬规则 6）；tours 只读。
      - /mnt/venvs/simpraxis:/mnt/venvs/simpraxis
      - /mnt/artifacts:/mnt/artifacts
      - /mnt/caches:/mnt/caches
      - /mnt/assets:/mnt/assets:ro
      # Task0b 三层分离：解题方案内容层只读挂载（KB 公开仓 solutions/），
      # 解析器在容器内经 SIMPRAXIS_SOLUTIONS_ROOT=/kb 读取，禁写。
      - ${KB_ROOT:-/home/vipuser/embodied-ai-sim-knowledge-base}/solutions:/kb:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
